ci:
  # pylint needs the plugin and its dependencies installed, pre-commit.ci
  # cannot run it. GitHub Actions runs the tests, and you can run pylint there.
  skip: [pylint]

# The functional tests hold code that is wrong on purpose, and their expected
# output gives line numbers: no hook should change them.
exclude: ^tests/functional/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.31.1
    hooks:
      - id: zizmor
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format
  - repo: https://github.com/DanielNoord/pydocstringformatter
    rev: v1.0.0
    hooks:
      - id: pydocstringformatter
        args: ["--max-summary-lines=2", "--linewrap-full-docstring"]
  - repo: local
    hooks:
      - id: pylint
        name: pylint
        # The pylint of your environment, where the plugin is installed:
        # pip install -e . --group test
        entry: pylint
        language: system
        types: [python]
        args: ["-rn", "-sn"]
  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.414
    hooks:
      - id: pyright
        additional_dependencies: ["pylint>=4,<5", "pytest>=8"]
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        additional_dependencies: ["pylint>=4,<5", "pytest>=8"]
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-r", "-lll"]
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args: ["--toml=pyproject.toml"]
        additional_dependencies: ["tomli"]
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.10
    hooks:
      - id: prettier
  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: v2.30.3
    hooks:
      - id: pyproject-fmt
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: "0.26"
    hooks:
      - id: validate-pyproject
