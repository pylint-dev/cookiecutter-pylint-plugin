[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=77", "setuptools-scm>=8" ]

[project]
name = "{{ cookiecutter.plugin_name }}"
description = "{{ cookiecutter.short_description }}"
readme = "README.md"
license = "{{ cookiecutter.license }}"
license-files = [ "LICENSE" ]
authors = [ { name = "{{ cookiecutter.full_name }}", email = "{{ cookiecutter.email }}" } ]
requires-python = ">=3.10"
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [ "pylint>=4,<5" ]
dynamic = [ "version" ]
urls.Source = "https://github.com/{{ cookiecutter.github_username }}/{{ cookiecutter.plugin_name }}"

[dependency-groups]
test = [ "pylint[testutils]", "pytest>=8" ]

[tool.setuptools]
packages = [ "{{ cookiecutter.module_name }}" ]

[tool.setuptools_scm]

[tool.pytest.ini_options]
testpaths = [ "tests" ]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
lint.select = [ "B", "E", "F", "I", "UP", "W" ]
