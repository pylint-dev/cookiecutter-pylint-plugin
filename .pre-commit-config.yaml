# The template folder holds Jinja, which is not valid Python or YAML: ruff
# and check-yaml skip it.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        # Its last line ends in Jinja that already adds the final newline.
        exclude: ^\{\{cookiecutter\.plugin_name\}\}/LICENSE$
      - id: trailing-whitespace
      - id: check-json
      - id: check-toml
      - id: check-yaml
        exclude: &template ^\{\{cookiecutter\.plugin_name\}\}/
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: ["--fix"]
        exclude: *template
      - id: ruff-format
        exclude: *template
